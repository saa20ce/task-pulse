version: '3.8'
services:
  db:
    image: postgres:15
    enviroment:
      POSTGRES_DB: taskpulse_db
      POSTGRES_USER: taskpulse_user
      POSTGRES_PASSWORD: taskpulse_pass
    volumes:
      - db_data:var/lib/posgresql/data
    networks:
      - tasknet

  rabbitmq:
    image: rabbitmq:3-management
    enviroment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASSWORD: guest
    ports:
      - '15672:15672'
    newworks:
      - tasknet

  backend:
    build:
      context: ./backend
    command: sh -c 'python manage.py migrate && python manage.py runserver 0.0.0.0:8000'
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    ports:
      - '8000:8000'
    depends_on:
      - db
      - rabbitmq
    network:
      - tasknet

  worker:
    build:
      context: ./backend
    command: sh -c 'celery -A core worker --loglevel=info'
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - rabbitmq
    network:
      - tasknet

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
    ports:
      - '3000:3000'
    depends_on:
      - backend
    network:
      - tasknet

volumes:
  db_data:

network:
  tasknet: